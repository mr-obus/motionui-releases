<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotionUI</title>
<link rel="icon" href="/icon.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b; color: #fafafa;
         font: 15px/1.5 Inter, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(420px, calc(100% - 32px)); padding: 28px; background: #18181b; border: 1px solid #27272a; border-radius: 12px; }
  img.logo { height: 22px; display: block; margin-bottom: 22px; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  p { margin: 0 0 20px; color: #a1a1aa; }
  small { line-height: 1.6; }
  a.button { display: block; padding: 10px 16px; line-height: 1.5; text-align: center; background: #fafafa; color: #18181b; border-radius: 7px;
             text-decoration: none; font-weight: 500; }
  a.button:hover { background: #e4e4e7; }
  a.button.ghost { background: transparent; color: #fafafa; border: 1px solid #3f3f46; }
  .buttons { display: flex; flex-direction: column; gap: 10px; }
  a.button.ghost:hover { background: #27272a; }
  small { display: block; margin-top: 16px; color: #71717a; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/logo.svg" alt="MotionUI">
  <h1>MotionUI</h1>
  <p>Links Figma, After Effects and Claude, and keeps the MotionUI panel up to date.</p>
  <div class="buttons">
    <a class="button" href="/download">Download for Mac 1.3.14</a>
    <a class="button ghost" href="/download/windows">Download for Windows 1.3.14</a>
  </div>
  <small>macOS 14.0 or later | Apple silicon and Intel | Windows 10 or later, Intel and ARM</small>
</main>
</body>
</html>
